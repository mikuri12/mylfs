name: live

on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - '.github/workflows/live.yml'
  workflow_dispatch:

# Fase 3 del PLAN (adelantada): ISO live de prueba desde el rootfs
# validado. NO es instalador: arranca por USB sin tocar el disco.
# squashfs zstd + overlayfs en RAM + dracut dmsquash-live + GRUB UEFI.

permissions:
  contents: write

jobs:
  live-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Instalar herramientas de la ISO (grub/xorriso/squashfs/qemu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq grub-pc-bin grub-efi-amd64-bin xorriso squashfs-tools mtools \
            qemu-system-x86 ovmf

      - name: Descargar rootfs validado (release rootfs-base-v1)
        run: |
          mkdir -p incoming
          gh release download rootfs-base-v1 -R mikuri12/mylfs -D incoming \
            --pattern 'rootfs-base.tar.zst.part*' --pattern '*.sha256'
          cat incoming/rootfs-base.tar.zst.part* > incoming/rootfs-base.tar.zst
          grep 'rootfs-base.tar.zst$' incoming/rootfs-base.tar.zst.sha256 | ( cd incoming && sha256sum -c - )
          rm -f incoming/rootfs-base.tar.zst.part*
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Descargar paquetes del escritorio (Release 'packages' de mymypkgs)
        # FASE 3: la ISO lleva el rootfs base + TODOS los paquetes publicados
        # (menos linux-mikuri: el kernel ya está en el rootfs). Se listan por
        # API (browser_download_url), no por index.toml (puede estar stale).
        run: |
          mkdir -p pkgs
          gh api repos/mikuri12/mymypkgs/releases/tags/packages --paginate \
            --jq '.assets[].browser_download_url' \
            | grep '\.tar\.zst$' | grep -v '/linux-mikuri-' > pkgs/list.txt
          echo "$(wc -l < pkgs/list.txt) paquetes a descargar"
          while read -r u; do
            f=$(basename "$u")
            [ -f "pkgs/$f" ] && continue
            for i in 1 2 3 4 5; do
              curl -fsSL --retry 3 --retry-all-errors -o "pkgs/$f" "$u" && break
              echo "retry $f ($i)"; sleep 20
            done
          done < pkgs/list.txt
          echo "descargados: $(ls pkgs/*.tar.zst 2>/dev/null | wc -l)"
          du -sh pkgs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Construir ISO (live/make-live.sh)
        run: |
          bash live/make-live.sh "$(pwd)/incoming/rootfs-base.tar.zst" "$(pwd)/pkgs"

      - name: Test QEMU + OVMF hasta greetd (consola serial, autologin)
        run: |
          # Ruta OVMF COMBINADA — igual que base/qemu-test.sh (que sí bootea):
          # apt pone la imagen en /usr/share/ovmf/OVMF.fd; con -bios combinado
          # GRUB corre; pflash 4M separado muere pre-GRUB (lección fase 1).
          OVMF=""
          for cand in /usr/share/ovmf/OVMF.fd /usr/share/qemu/OVMF.fd /usr/share/OVMF/OVMF_CODE_4M.fd; do
            [ -f "$cand" ] && OVMF="$cand" && break
          done
          [ -n "$OVMF" ] || { echo "no se encontró firmware OVMF"; exit 1; }
          echo "OVMF: $OVMF"
          mkdir -p serial && : > serial/console.log
          # 900s: la ISO v2 (rootfs+paquetes, squashfs ~3GB) tarda más en montar
          timeout 900 qemu-system-x86_64 \
            -machine q35 -cpu max -m 4096 -smp 2 \
            -bios "$OVMF" \
            -cdrom mylfs-live.iso \
            -display none -no-reboot \
            -serial file:serial/console.log \
            -netdev user,id=n0 -device e1000,netdev=n0 2>&1 | tail -5
          echo "=== últimas líneas del serial ==="
          tail -30 serial/console.log
          # FASE 3: autologin en ttyS0 imprime el marker con el estado de los
          # servicios (ver make-live.sh /etc/profile.d/mylfs-live-check.sh).
          grep -q "MYLFS_LIVE_READY" serial/console.log || {
            echo "no hubo autologin por serial"; tail -60 serial/console.log; exit 1; }
          grep -q "MYLFS_SVC greetd: run:" serial/console.log && \
            echo "QEMU ARRANCÓ HASTA GREETD ✓" || {
            echo "greetd no está corriendo"; grep "MYLFS_SVC" serial/console.log; tail -60 serial/console.log; exit 1; }

      - name: Release live-v2 (tras QEMU verde)
        if: github.ref == 'refs/heads/main'
        run: |
          SIZE=$(stat -c%s mylfs-live.iso)
          echo "tamaño ISO: $SIZE bytes"
          if [ "$SIZE" -lt 1900000000 ]; then
            # mylfs-live.iso.sha256 ya lo generó make-live.sh en el cwd
            gh release view live-v2 -R mikuri12/mylfs >/dev/null 2>&1 || \
              gh release create live-v2 -R mikuri12/mylfs \
                --title "mylfs-live v2 — LFS 12.4 + kernel 7.1.5-mikuri + escritorio (greetd/Noctalia/Halley)" \
                --notes-file live/RELEASE-NOTES.md
            gh release upload live-v2 -R mikuri12/mylfs --clobber \
              mylfs-live.iso mylfs-live.iso.sha256
          else
            split -b 1900M -d mylfs-live.iso mylfs-live.iso.part
            sha256sum mylfs-live.iso mylfs-live.iso.part* | sudo tee mylfs-live.iso.sha256 > /dev/null
            sudo chown runner:runner mylfs-live.iso.part* mylfs-live.iso.sha256
            gh release view live-v2 -R mikuri12/mylfs >/dev/null 2>&1 || \
              gh release create live-v2 -R mikuri12/mylfs \
                --title "mylfs-live v2 — LFS 12.4 + kernel 7.1.5-mikuri + escritorio (greetd/Noctalia/Halley)" \
                --notes-file live/RELEASE-NOTES.md
            gh release upload live-v2 -R mikuri12/mylfs --clobber \
              mylfs-live.iso.part* mylfs-live.iso.sha256
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Subir ISO como artifact (respaldo de 1 día)
        uses: actions/upload-artifact@v4
        with:
          name: mylfs-live-iso
          path: mylfs-live.iso
          retention-days: 1

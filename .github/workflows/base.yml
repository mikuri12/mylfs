name: base

on:
  push:
    branches: [main]
    paths:
      - 'base/**'
      - 'kernel/**'
      - '.github/workflows/base.yml'
  workflow_dispatch:

# PLAN: un job por etapa, needs encadenados, ninguno > 5 h, artifact tarball
# con retention-days: 1. Estado entre jobs como tarball --zstd --numeric-owner.

permissions:
  contents: write

jobs:
  stage1-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LFS: /mnt/lfs
      # Ajustes del PLAN (make.conf.sh):
      CCACHE_DIR: /mnt/work/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco y liberación de espacio
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/bin/google-chrome* 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      # El runner NO es root (usuario 'runner' + sudo): los pasos que crean
      # usuarios, montan o escriben en /mnt/lfs van con sudo.
      - name: Crear usuario lfs y layout (LFS 12.4 §4.3-4.4, §5.1)
        run: sudo bash base/setup-user.sh

      - name: Preflight del host (LFS 12.4 §2.2 version-check)
        run: |
          # El libro exige: sh→bash, awk→gawk, yacc→bison
          sudo ln -sf bash /bin/sh
          sudo ln -sf gawk /usr/bin/awk
          sudo ln -sf bison /usr/bin/yacc
          bash base/version-check.sh

      - name: Descargar y verificar fuentes (manifiesto sha256)
        run: |
          for i in 1 2 3; do
            if sudo bash base/download-sources.sh; then exit 0; fi
            echo "descarga falló (intento $i), reintentando en 20s…"
            sleep 20
          done
          exit 1

      - name: Etapa 1 — toolchain temporal (LFS caps. 5-6)
        run: sudo bash base/ch05.sh

      - name: Empaquetar $LFS como tarball (estado para etapa 2)
        run: |
          sudo mkdir -p /mnt/dist
          sudo tar --zstd -cpf /mnt/dist/lfs-stage1.tar.zst -C /mnt lfs --numeric-owner --keep-directory-symlink
          sudo chown runner:runner /mnt/dist/lfs-stage1.tar.zst
          zstd -t /mnt/dist/lfs-stage1.tar.zst
          ls -la /mnt/dist/

      - name: Subir artifact (retention 1 día, PLAN)
        uses: actions/upload-artifact@v4
        with:
          name: lfs-stage1
          path: /mnt/dist/lfs-stage1.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Informe final
        run: |
          sudo du -sh "$LFS/tools" "$LFS/usr" 2>/dev/null || true
          df -h /

  stage2-chroot:
    needs: [stage1-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LFS: /mnt/lfs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco y liberación de espacio
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/bin/google-chrome* 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Descargar artifact de la etapa 1
        uses: actions/download-artifact@v4
        with:
          name: lfs-stage1
          path: incoming

      - name: Restaurar $LFS desde el tarball de la etapa 1
        run: |
          # El tarball lleva prefijo lfs/ (creado con -C /mnt lfs): extraer en /mnt.
          # /mnt es del root → sudo. tar recrea /mnt/lfs con --numeric-owner.
          sudo tar --zstd -xpf incoming/lfs-stage1.tar.zst -C /mnt --numeric-owner --keep-directory-symlink
          rm -f incoming/lfs-stage1.tar.zst
          sudo ls /mnt/lfs
          df -h /mnt

      - name: Descargar fuentes etapa 2 (manifiesto sha256)
        run: |
          for i in 1 2 3; do
            if sudo bash base/download-sources.sh base/sources-12.4.stage2.tsv; then exit 0; fi
            echo "descarga falló (intento $i), reintentando en 20s…"
            sleep 20
          done
          exit 1

      - name: Etapa 2 — chroot + herramientas (LFS caps. 7)
        run: sudo bash base/ch07.sh

      - name: Empaquetar $LFS como tarball (estado para etapa 3)
        run: |
          sudo mkdir -p /mnt/dist
          sudo tar --zstd -cpf /mnt/dist/lfs-stage2.tar.zst -C /mnt lfs --numeric-owner --keep-directory-symlink
          sudo chown runner:runner /mnt/dist/lfs-stage2.tar.zst
          zstd -t /mnt/dist/lfs-stage2.tar.zst
          ls -la /mnt/dist/

      - name: Subir artifact (retention 1 día, PLAN)
        uses: actions/upload-artifact@v4
        with:
          name: lfs-stage2
          path: /mnt/dist/lfs-stage2.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Informe final
        run: |
          sudo du -sh "$LFS/usr" 2>/dev/null || true
          df -h /

  stage3-base:
    needs: [stage2-chroot]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LFS: /mnt/lfs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco y liberación de espacio
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/bin/google-chrome* 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Descargar artifact de la etapa 2
        uses: actions/download-artifact@v4
        with:
          name: lfs-stage2
          path: incoming

      - name: Restaurar $LFS desde el tarball de la etapa 2
        run: |
          sudo tar --zstd -xpf incoming/lfs-stage2.tar.zst -C /mnt --numeric-owner --keep-directory-symlink
          rm -f incoming/lfs-stage2.tar.zst
          sudo ls /mnt/lfs
          df -h /mnt

      - name: Descargar fuentes etapa 3 (manifiestos sha256)
        run: |
          ok3=0
          for i in 1 2 3; do
            if sudo bash base/download-sources.sh base/sources-12.4.stage3.tsv; then ok3=1; break; fi
            echo "descarga stage3 falló (intento $i), reintentando en 20s…"
            sleep 20
          done
          [ $ok3 -eq 1 ] || { echo "stage3.tsv no descargó tras 3 intentos"; exit 1; }
          okx=0
          for i in 1 2 3; do
            if sudo bash base/download-sources.sh base/sources-extra.stage3.tsv; then okx=1; break; fi
            echo "descarga extras falló (intento $i), reintentando en 20s…"
            sleep 20
          done
          [ $okx -eq 1 ] || { echo "extras no descargó tras 3 intentos"; exit 1; }

      - name: Etapa 3 — sistema base final (LFS cap. 8 + extras del PLAN)
        run: sudo bash base/ch08.sh

      - name: Empaquetar $LFS como tarball (estado para etapa 4)
        run: |
          sudo mkdir -p /mnt/dist
          sudo tar --zstd -cpf /mnt/dist/lfs-stage3.tar.zst -C /mnt lfs --numeric-owner --keep-directory-symlink
          sudo chown runner:runner /mnt/dist/lfs-stage3.tar.zst
          zstd -t /mnt/dist/lfs-stage3.tar.zst
          ls -la /mnt/dist/

      - name: Subir artifact (retention 1 día, PLAN)
        uses: actions/upload-artifact@v4
        with:
          name: lfs-stage3
          path: /mnt/dist/lfs-stage3.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Informe final
        run: |
          sudo du -sh "$LFS/usr" "$LFS/lib" 2>/dev/null || true
          df -h /

  stage4-bootable:
    needs: [stage3-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LFS: /mnt/lfs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco y liberación de espacio
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/bin/google-chrome* 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Descargar artifact de la etapa 3
        uses: actions/download-artifact@v4
        with:
          name: lfs-stage3
          path: incoming

      - name: Restaurar $LFS desde el tarball de la etapa 3
        run: |
          sudo mkdir -p /mnt/lfs
          sudo tar --zstd -xpf incoming/lfs-stage3.tar.zst -C /mnt --numeric-owner --keep-directory-symlink
          rm -f incoming/lfs-stage3.tar.zst
          sudo ls /mnt/lfs
          df -h /mnt

      - name: Descargar fuentes etapa 4 (manifiesto sha256)
        run: |
          for i in 1 2 3; do
            if sudo bash base/download-sources.sh base/sources-12.4.stage4.tsv; then exit 0; fi
            echo "descarga falló (intento $i), reintentando en 20s…"
            sleep 20
          done
          exit 1

      - name: Etapa 4 — kernel, GRUB, dracut, runit (LFS caps. 9-11)
        run: sudo bash base/ch09-11.sh

      - name: Empaquetar rootfs final (para QEMU y release)
        run: |
          sudo mkdir -p /mnt/dist
          sudo tar --zstd -cpf /mnt/dist/rootfs-base.tar.zst -C /mnt lfs --numeric-owner --keep-directory-symlink
          sudo chown runner:runner /mnt/dist/rootfs-base.tar.zst
          zstd -t /mnt/dist/rootfs-base.tar.zst
          ls -la /mnt/dist/

      - name: Test QEMU + OVMF hasta login
        run: sudo bash base/qemu-test.sh /mnt/dist/rootfs-base.tar.zst

      - name: Subir artifact del rootfs (retention 1 día)
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-base
          path: /mnt/dist/rootfs-base.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Release rootfs-base-v1 (tras QEMU verde)
        if: github.ref == 'refs/heads/main'
        run: |
          # /mnt/dist es del root (creado con sudo): TODO el paso va con sudo,
          # y las notas se escriben primero en /tmp (writable por runner).
          cat > /tmp/release-notes.txt << 'RNOTES'
          Sistema base arrancable: LFS 12.4 (libro SysV) con runit, eudev,
          Linux-PAM + shadow con PAM, openssh, opendoas, dhcpcd, chrony,
          acpid, curl, ca-certificates, dracut, GRUB UEFI y kernel
          7.1.5-mikuri (CachyOS+BORE). Test QEMU+OVMF hasta login OK:
          runit stage 1→2, agetty, hostname optipex-mikuri.

          El tarball supera el límite de 2GB por asset de GitHub: va partido
          en rootfs-base.tar.zst.partNN. Reconstruir con:
            cat rootfs-base.tar.zst.part* > rootfs-base.tar.zst
            sha256sum -c rootfs-base.tar.zst.sha256
            sudo tar --zstd -xpf rootfs-base.tar.zst -C /mnt --numeric-owner --keep-directory-symlink
          RNOTES
          cd /mnt/dist
          sudo split -b 1900M -d rootfs-base.tar.zst rootfs-base.tar.zst.part
          # redirect lo abre el shell (runner) ANTES de sudo → usar tee
          sudo sha256sum rootfs-base.tar.zst rootfs-base.tar.zst.part* | sudo tee rootfs-base.tar.zst.sha256 > /dev/null
          sudo chown runner:runner rootfs-base.tar.zst.part* rootfs-base.tar.zst.sha256
          gh release create rootfs-base-v1 \
            --title "rootfs-base v1 — LFS 12.4 + kernel 7.1.5-mikuri" \
            --notes-file /tmp/release-notes.txt \
            rootfs-base.tar.zst.part* rootfs-base.tar.zst.sha256
        env:
          GH_TOKEN: ${{ github.token }}

  # La ISO live (fase 3) se añade tras validar este rootfs en hardware real.
